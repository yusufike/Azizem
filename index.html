<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel Bir Sürpriz ❤️</title>
    <style>
        :root {
            --bg: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text: #333333;
            --text-sub: #555555;
            --shadow: rgba(230, 57, 70, 0.2);
            --border: #ffccd5;
            --accent: #e63946;
        }

        [data-theme="dark"] {
            --bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.95);
            --text: #f8fafc;
            --text-sub: #cbd5e1;
            --shadow: rgba(0, 0, 0, 0.5);
            --border: #475569;
            --accent: #ff4d6d;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            padding: 15px;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none !important;
            z-index: 0;
        }

        /* Üst Header */
        .top-header-container {
            position: fixed; top: 12px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 400px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 100;
        }

        .top-navbar {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }

        .top-info {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 14px; border-radius: 20px;
            box-shadow: 0 4px 12px var(--shadow);
            flex: 1; margin-right: 10px;
        }

        .top-info .title { font-size: 12px; font-weight: bold; color: var(--accent); }
        .top-info .sub { font-size: 10px; color: var(--text-sub); }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 38px; height: 38px; border-radius: 50%;
            cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Üst Müzik Kutusu */
        .top-music-box {
            background: rgba(20, 20, 20, 0.9);
            color: white; border-radius: 20px;
            padding: 8px 12px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
        }

        .play-btn {
            background: #1db954; border: none;
            width: 32px; height: 32px; border-radius: 50%;
            color: black; font-weight: bold; cursor: pointer;
            flex-shrink: 0; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        .music-info { flex: 1; overflow: hidden; }
        .music-title { font-size: 11px; font-weight: bold; white-space: nowrap; text-overflow: ellipsis; }
        .music-sub { font-size: 9px; color: #b3b3b3; }

        /* Ana Kart */
        .card {
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px var(--shadow);
            text-align: center;
            max-width: 400px; width: 100%;
            position: relative; z-index: 10;
            margin-top: 80px;
        }

        h2 { color: var(--accent); margin-bottom: 10px; font-size: 20px; }
        p { color: var(--text-sub); font-size: 13px; margin-bottom: 15px; line-height: 1.4; min-height: 36px; }

        input[type="text"] {
            width: 100%; padding: 12px;
            border: 2px solid var(--border);
            border-radius: 14px; outline: none;
            font-size: 14px; text-align: center;
            margin-bottom: 10px; background: rgba(255,255,255,0.7);
        }

        .btn-main {
            width: 100%; background: var(--accent);
            color: white; border: none; padding: 12px;
            border-radius: 14px; font-weight: bold;
            font-size: 14px; cursor: pointer;
        }

        .error-msg { color: var(--accent); font-size: 12px; margin-top: 8px; display: none; font-weight: bold; }

        #main-content { display: none; }

        /* Evet / Hayır */
        .vote-box { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        .btn-vote { padding: 10px 22px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer; font-size: 13px; }
        #btn-yes { background: #2ecc71; color: white; }
        #btn-no { background: #e74c3c; color: white; }

        .action-btn {
            background: var(--accent); color: white; border: none;
            padding: 10px; border-radius: 14px; font-weight: bold;
            width: 100%; margin-top: 10px; cursor: pointer; font-size: 12px;
        }

        .fortune-box {
            background: rgba(230,57,70,0.1); padding: 10px;
            border-radius: 12px; border: 1px dashed var(--accent);
            margin-top: 10px; font-size: 12px; color: var(--accent); font-weight: bold;
            min-height: 35px; display: flex; align-items: center; justify-content: center;
        }

        /* KAZI KAZAN ALANI */
        .scratch-container {
            position: relative;
            width: 100%; max-width: 280px; height: 110px;
            margin: 15px auto 5px auto;
            border-radius: 16px; overflow: hidden;
            border: 2px dashed var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .scratch-secret {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fff;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 10px; text-align: center;
            color: var(--accent); font-weight: bold; font-size: 13px;
        }

        .scratch-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            cursor: pointer; z-index: 2;
        }

        /* Chatbot */
        .chat-btn {
            position: fixed; bottom: 15px; right: 15px;
            width: 50px; height: 50px; border-radius: 50%;
            background: var(--accent); color: white;
            border: none; font-size: 22px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 500;
        }

        .chat-win {
            position: fixed; bottom: 75px; right: 15px;
            width: 280px; height: 340px;
            background: var(--card-bg); border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            display: none; flex-direction: column; z-index: 500;
            overflow: hidden;
        }

        .chat-header { background: var(--accent); color: white; padding: 10px; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; }
        .chat-body { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .msg { padding: 6px 10px; border-radius: 10px; font-size: 11px; max-width: 85%; }
        .msg.bot { background: rgba(230,57,70,0.1); color: var(--text); align-self: flex-start; }
        .msg.user { background: var(--accent); color: white; align-self: flex-end; }

        .chat-input-area { padding: 6px; display: flex; gap: 4px; border-top: 1px solid var(--border); }
        .chat-input-area input { flex: 1; padding: 6px; border: 1px solid var(--border); border-radius: 10px; font-size: 11px; outline: none; margin: 0; }
        .chat-input-area button { background: var(--accent); color: white; border: none; padding: 6px 10px; border-radius: 10px; font-weight: bold; font-size: 11px; cursor: pointer; }

        /* Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); z-index: 1000;
            display: none; justify-content: center; align-items: center; padding: 15px;
        }

        .modal-card {
            background: var(--card-bg); padding: 20px; border-radius: 20px;
            text-align: center; max-width: 320px; width: 100%; border: 2px solid var(--accent);
        }

        #police-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 999; display: none; opacity: 0.4;
        }
        .flash { animation: strobe 0.3s infinite alternate; }
        @keyframes strobe { 0% { background: red; } 100% { background: blue; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="police-overlay"></div>
    <canvas id="bgCanvas"></canvas>

    <!-- Üst Alan (Sayaç + Müzik Çalar) -->
    <div class="top-header-container">
        <div class="top-navbar">
            <div class="top-info">
                <div class="title">❤️ 13 Gündür Sevgiliyiz</div>
                <div class="sub">Dünyam değişti ✨</div>
            </div>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>

        <div class="top-music-box">
            <button class="play-btn" onclick="toggleMusic()" id="playBtn">▶</button>
            <div class="music-info">
                <div class="music-title">Ben Seninle Mutluyum</div>
                <div class="music-sub">Azer Bülbül ❤️</div>
            </div>
        </div>
    </div>

    <!-- 1. GİRİŞ EKRANI -->
    <div id="login-screen" class="card">
        <h2>Hoş Geldin ❤️</h2>
        <p id="login-desc"></p>
        <input type="text" id="password-input" placeholder="Şifre..." onkeypress="if(event.key==='Enter') checkPassword()">
        <button class="btn-main" onclick="checkPassword()">Giriş Yap</button>
        <div id="error-message" class="error-msg">Yanlış şifre! Bir daha dene 😜</div>
    </div>

    <!-- 2. ANA İÇERİK -->
    <div id="main-content" class="card">
        <h2>Seni Çok Seviyorum! ✨</h2>
        <p id="main-desc"></p>

        <h3 style="color: var(--accent); margin-top: 15px; font-size: 13px;">Beni affettin mi? 🥺</h3>
        
        <div class="vote-box">
            <button id="btn-yes" class="btn-vote" onclick="accepted()">Evet ❤️</button>
            <button id="btn-no" class="btn-vote" onclick="triggerBargain()">Hayır 💔</button>
        </div>
    </div>

    <!-- CHATBOT -->
    <button class="chat-btn" onclick="toggleChat()">💬</button>
    <div class="chat-win" id="chatWin">
        <div class="chat-header">
            <span>Sanal Asistan ❤️</span>
            <span style="cursor:pointer;" onclick="toggleChat()">✕</span>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Yaz..." onkeypress="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()">Gönder</button>
        </div>
    </div>

    <!-- PAZARLIK MODALI -->
    <div class="modal" id="bargainModal">
        <div class="modal-card">
            <span style="background:var(--accent); color:white; font-size:10px; padding:2px 8px; border-radius:10px; font-weight:bold;" id="mBadge">🚨 UYARI</span>
            <h3 id="mTitle" style="color:var(--accent); font-size:15px; margin: 8px 0 4px 0;">DİKKAT!</h3>
            <p id="mDesc" style="font-size:11px; color:var(--text-sub); margin-bottom:12px; min-height:auto;"></p>
            <button class="btn-main" id="mAccept" onclick="acceptModal()">Anlaştık, Affettim ❤️</button>
            <button style="background:transparent; border:none; color:var(--text-sub); font-size:11px; margin-top:8px; cursor:pointer;" id="mNext" onclick="nextBargain()">İkna olmadım</button>
        </div>
    </div>

    <script>
        // Daktilo Efekti
        function typeWriter(elementId, text, speed = 40, callback) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        window.onload = function() {
            typeWriter("login-desc", "Devam etmek için özel şifremizi gir:");
            setTimeout(() => {
                addMsg("Selam güzellik! Bana istediğin şeyi sorabilirsin 🥰", "bot");
            }, 600);
        };

        // Arka Plan Animasyonu
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const particles = Array.from({length: 20}, () => ({
            x: Math.random() * canvas.width, y: Math.random() * canvas.height,
            size: Math.random() * 3 + 1, speed: Math.random() * 0.5 + 0.2
        }));

        function drawBg() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                p.y -= p.speed;
                if(p.y < 0) p.y = canvas.height;
            });
            requestAnimationFrame(drawBg);
        }
        drawBg();

        // Şifre Kontrolü
        function checkPassword() {
            const val = document.getElementById("password-input").value.trim().toLowerCase();
            if (val === "azizemm") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                typeWriter("main-desc", "Biliyorum belki seni kırdım... Ama senin gönlünü almak benim için her şeyden önemli.");
            } else {
                document.getElementById("error-message").style.display = "block";
            }
        }

        // Müzik Çalar
        const music = new Audio('Azer Bülbül - Ben Seninle Mutluyum(_t1jBwvACMgk_).m4a');
        music.loop = true;
        let isPlaying = false;

        function toggleMusic() {
            const btn = document.getElementById("playBtn");
            if (isPlaying) {
                music.pause();
                isPlaying = false;
                btn.innerText = "▶";
            } else {
                music.play().then(() => {
                    isPlaying = true;
                    btn.innerText = "❚❚";
                }).catch(() => {});
            }
        }

        // Tema
        function toggleTheme() {
            const isDark = document.documentElement.getAttribute("data-theme") === "dark";
            document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
            document.getElementById("themeBtn").innerText = isDark ? "🌙" : "☀️";
        }

        // Pazarlık Sistemi
        let step = 0;
        const offers = [
            { badge: "🚨 ALARM", title: "Yasadışı Karar!", desc: "1 Karam Çikolata karşılığında anlaşalım mı?", btn: "🍫 Karam'ı Kabul Et & Affet" },
            { badge: "📜 SÖZLEŞME", title: "Yeni Teklif!", desc: "Sonsuz sarılma + Sınırsız öpücük sözleşmesi!", btn: "💋 Sözleşmeyi İmzala & Affet" },
            { badge: "👑 PROTOKOL", title: "Son Teklif!", desc: "Artık 'Evet' demek zorundasın 🥰", btn: "👑 Onayla (Affedildin!)" }
        ];

        function triggerBargain() {
            const overlay = document.getElementById("police-overlay");
            overlay.style.display = "block"; overlay.classList.add("flash");
            step = 0; showModalUI();
            document.getElementById("bargainModal").style.display = "flex";
        }

        function showModalUI() {
            const item = offers[step];
            document.getElementById("mBadge").innerText = item.badge;
            document.getElementById("mTitle").innerText = item.title;
            document.getElementById("mDesc").innerText = item.desc;
            document.getElementById("mAccept").innerText = item.btn;
            document.getElementById("mNext").style.display = step >= offers.length - 1 ? "none" : "block";
        }

        function nextBargain() { if(step < offers.length - 1) { step++; showModalUI(); } }
        function acceptModal() {
            document.getElementById("police-overlay").style.display = "none";
            document.getElementById("bargainModal").style.display = "none";
            accepted();
        }

        // Evet Ekrana Geçiş
        function accepted() {
            document.getElementById("police-overlay").style.display = "none";
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <h2>OLEY! ❤️</h2>
                <p id="accepted-desc" style="font-weight:bold;"></p>
                
                <!-- Kazı Kazan Kartı -->
                <div class="scratch-container">
                    <div class="scratch-secret">
                        <span>🎁 SÜRPRİZ KAZANDIN!</span>
                        <span style="font-size: 11px; font-weight: normal; margin-top: 4px; color: var(--text-sub);">
                            Sınırsız Sarımsaklı Ekmek + Kocaman Bir Sarılma! 💖
                        </span>
                    </div>
                    <canvas id="scratchCanvas" class="scratch-canvas"></canvas>
                </div>

                <button class="action-btn" onclick="spinReason()">🎲 Neden Seni Seviyorum?</button>
                <div class="fortune-box" id="fText">Kart çekmek için butona tıkla! 👆</div>
            `;
            
            typeWriter("accepted-desc", "Dünyanın en mutlu insanı benim! Seni çok seviyorum.");
            initScratch(); // Kazı kazan motorunu başlat

            if(!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    document.getElementById("playBtn").innerText = "❚❚";
                }).catch(() => {});
            }

            if(typeof confetti === 'function') confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
        }

        // KAZI KAZAN MOTORU
        function initScratch() {
            const sCanvas = document.getElementById('scratchCanvas');
            if(!sCanvas) return;
            const sCtx = sCanvas.getContext('2d');
            const rect = sCanvas.parentElement.getBoundingClientRect();
            sCanvas.width = rect.width;
            sCanvas.height = rect.height;

            // Gri Tabakayı Çiz
            sCtx.fillStyle = '#c0c0c0';
            sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);
            
            // Üzerine Yazı
            sCtx.fillStyle = '#555';
            sCtx.font = 'bold 12px system-ui';
            sCtx.textAlign = 'center';
            sCtx.fillText('✨ Burayı Kazı ✨', sCanvas.width / 2, sCanvas.height / 2 + 4);

            let isScratching = false;

            function scratch(e) {
                if (!isScratching) return;
                const cRect = sCanvas.getBoundingClientRect();
                const touch = e.touches ? e.touches[0] : e;
                const x = touch.clientX - cRect.left;
                const y = touch.clientY - cRect.top;

                sCtx.globalCompositeOperation = 'destination-out';
                sCtx.beginPath();
                sCtx.arc(x, y, 16, 0, Math.PI * 2);
                sCtx.fill();
            }

            sCanvas.addEventListener('mousedown', () => isScratching = true);
            sCanvas.addEventListener('mouseup', () => isScratching = false);
            sCanvas.addEventListener('mousemove', scratch);

            sCanvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); });
            sCanvas.addEventListener('touchend', () => isScratching = false);
            sCanvas.addEventListener('touchmove', scratch);
        }

        const reasons = [
            "✨ Çünkü güldüğünde bütün dünyam aydınlanıyor.",
            "💖 Çünkü sesin bile içimi huzurla doldurmaya yetiyor.",
            "🌹 Çünkü sen benim en güzel 'iyi ki'msin.",
            "😍 Çünkü bakışınla kalbimi her seferinde çalmayı başarıyorsun."
        ];
        function spinReason() {
            const randomReason = reasons[Math.floor(Math.random() * reasons.length)];
            const fBox = document.getElementById('fText');
            fBox.innerHTML = "";
            let i = 0;
            function typeCard() {
                if (i < randomReason.length) {
                    fBox.innerHTML += randomReason.charAt(i);
                    i++;
                    setTimeout(typeCard, 30);
                }
            }
            typeCard();
        }

        // Chatbot
        function toggleChat() {
            const win = document.getElementById("chatWin");
            win.style.display = win.style.display === "flex" ? "none" : "flex";
        }

        function sendChat() {
            const inp = document.getElementById("chatInput");
            const txt = inp.value.trim();
            if(!txt) return;

            addMsg(txt, "user");
            inp.value = "";

            setTimeout(() => {
                let reply = "Seni düşünüp gülümsediğine eminim ❤️🥰";
                const lower = txt.toLowerCase();
                if(lower.includes("sev")) reply = "Seni dünyadaki HER ŞEYDEN daha çok seviyor! ❤️";
                else if(lower.includes("affet")) reply = "Seni asla kıramaz ki... Tek gülüşün yeter 🥺";
                else if(lower.includes("sarıl") || lower.includes("öp")) reply = "Kocaman sarılıp öpücük yolluyorum! 💋";
                addMsg(reply, "bot");
            }, 400);
        }

        function addMsg(txt, sender) {
            const body = document.getElementById("chatBody");
            const div = document.createElement("div");
            div.className = `msg ${sender}`;
            body.appendChild(div);
            
            let i = 0;
            function typeMsg() {
                if (i < txt.length) {
                    div.innerText += txt.charAt(i);
                    i++;
                    body.scrollTop = body.scrollHeight;
                    setTimeout(typeMsg, 25);
                }
            }
            typeMsg();
        }
    </script>
</body>
</html>
