<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel Bir Sürpriz ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(230, 57, 70, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease;
        }
        /* Titreme (Shake) Efekti */
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        h2 {
            color: #e63946;
            margin-bottom: 20px;
            font-weight: 700;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ffccd5;
            border-radius: 15px;
            outline: none;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #e63946;
            box-shadow: 0 0 10px rgba(230, 57, 70, 0.1);
        }
        .btn-main {
            width: 100%;
            background-color: #e63946;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-main:hover {
            background-color: #d62839;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #e63946;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        /* Anlık Uyarı Balonu */
        .toast-msg {
            color: #e63946;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
            transition: opacity 0.3s ease;
        }
        #main-content {
            display: none;
        }
        .ask-container {
            margin-top: 30px;
            position: relative;
            height: 120px;
        }
        .btn-vote {
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            position: absolute;
            transition: all 0.2s ease-out;
            font-size: 16px;
        }
        #btn-yes {
            background-color: #2ecc71;
            color: white;
            left: 20%;
            transform: translateX(-50%);
            z-index: 10;
        }
        #btn-yes:hover {
            background-color: #27ae60;
        }
        #btn-no {
            background-color: #95a5a6;
            color: white;
            right: 20%;
            transform: translateX(50%);
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        .floating-emoji {
            position: absolute;
            font-size: 24px;
            user-select: none;
            animation: floatUp 3s linear infinite;
            z-index: 100;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- GİRİŞ EKRANI -->
    <div id="login-screen" class="card">
        <h2>Hoş Geldin AZİZEMM❤️</h2>
        <p>Devam etmek için özel şifremizi girmen gerekiyor:</p>  
        <input type="password" id="password-input" placeholder="Şifreniz..." onkeypress="handleKeyPress(event)">
        <button class="btn-main" onclick="checkPassword()">Giriş Yap</button>
        <div id="error-message" class="error-msg">Yanlış şifre! Bir daha dene bakalım 😜</div>
    </div>
    <!-- ANA İÇERİK (Giriş Başarılı) -->
    <div id="main-content" class="card">
        <h2>Seni Çok Seviyorum! ✨</h2>
        <p>Biliyorum belki seni kırdım... Ama senin gönlünü almak benim için her şeyden önemli.</p>  
        <h3 style="color: #e63946; margin-top: 20px;">Beni affettin mi? 🥺</h3>
        <!-- Anlık Uyarı Mesajı -->
        <div id="toast" class="toast-msg"></div>
        <!-- Kaçan Buton Konteyneri -->
        <div class="ask-container">
            <button id="btn-yes" class="btn-vote" onclick="accepted()">Evet</button>
            <button id="btn-no" class="btn-vote" onmouseover="moveButton()" onclick="moveButton()">Hayır</button>
        </div>
    </div>
    <script>
        const SIFRE = "azizemm"; 
        function checkPassword() {
            const input = document.getElementById("password-input").value;
            const errorMsg = document.getElementById("error-message");        
            if (input === SIFRE) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                document.body.style.overflow = "auto";
            } else {
                errorMsg.style.display = "block";
                document.getElementById("password-input").value = "";
            }
        }
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        }
        // --- HAYIR BUTONU DEĞİŞKENLERİ VE LİSTELERİ ---
        let noCount = 0;
        let yesScale = 1;
        const noTexts = [
            "Hayır",
            "Emin misin?",
            "Bir daha düşün?",
            "Yapma lütfen 🥺",
            "Ciddi olamazsın!",
            "Bence Evet de 😉"
        ];
        const warnings = [
            "Sistem Hatası: 'Hayır' cevabı kalbiniz tarafından reddedildi! 🚫",
            "Yanlış buton! Yeşil olana basman gerekiyordu 😜",
            "Cihazınız bu kararı kabul etmiyor! 🔥",
            "Lütfen kalbinizin sesini dinleyin 🥺"
        ];
        function moveButton() {
            const btnNo = document.getElementById('btn-no');
            const btnYes = document.getElementById('btn-yes');
            const container = document.querySelector('.ask-container');
            const card = document.getElementById('main-content');
            const toast = document.getElementById('toast');
            noCount++;
            // 1. Hayır butonunun yazısını değiştir
            const textIndex = noCount % noTexts.length;
            btnNo.innerText = noTexts[textIndex];
            // 2. Evet butonunu her defasında biraz büyüt
            yesScale += 0.15;
            btnYes.style.transform = `translateX(-50%) scale(${yesScale})`;
            // 3. Kartı hafifçe salla (Shake)
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 300);
            // 4. Ekrana tatlı uyarı yazısı çıkar
            const warningIndex = noCount % warnings.length;
            toast.innerText = warnings[warningIndex];
            // 5. Üzgün Emojiler Yağdır
            createSadEmojis();
            // 6. Hayır butonunu rastgele bir yere kaçır
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNo.getBoundingClientRect();
            const maxX = containerRect.width - btnRect.width;
            const maxY = containerRect.height - btnRect.height;
            let newX, newY;
            do {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
            } while (Math.abs(newX - btnNo.offsetLeft) < 50 && Math.abs(newY - btnNo.offsetTop) < 50);
            btnNo.style.left = newX + 'px';
            btnNo.style.top = newY + 'px';
            btnNo.style.right = 'auto';
            btnNo.style.transform = 'none';
        }
        // Üzgün Emoji Üretme
        function createSadEmojis() {
            const sadEmojis = ['🥺', '😭', '💔'];
            for(let i=0; i<3; i++) {
                const emoji = document.createElement('div');
                emoji.classList.add('floating-emoji');
                emoji.innerText = sadEmojis[Math.floor(Math.random() * sadEmojis.length)];
                emoji.style.left = Math.random() * 90 + 'vw';
                emoji.style.top = '80vh';
                document.body.appendChild(emoji);
                setTimeout(() => { emoji.remove(); }, 2500);
            }
        }
        // --- AFFETME EYLEMİ VE ŞARKI ---
        function accepted() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = "<h2>OLEY! ❤️</h2><p>Dünyanın en mutlu insanı benim! Seni çok seviyorum, iyi ki varsın.</p>";      
            // Yüklediğin ses dosyasının tam adı
            const audio = new Audio('Azer Bülbül - Ben Seninle Mutluyum(_t1jBwvACMgk_).m4a');
            audio.play();
            // Kalp yağmuru başlat
            for(let i=0; i<30; i++) {
                createHeart();
            }
        }
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-emoji');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 3000);
        }
    </script>
</body>
</html>
