<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel Bir Sürpriz ❤️</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #333333;
            --text-sub: #555555;
            --card-shadow: rgba(230, 57, 70, 0.15);
            --input-border: #ffccd5;
            --box-bg: #fff0f3;
            --box-border: #ffb3c1;
        }
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31103f 100%);
            --card-bg: rgba(30, 41, 59, 0.92);
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --card-shadow: rgba(0, 0, 0, 0.5);
            --input-border: #475569;
            --box-bg: rgba(225, 29, 72, 0.1);
            --box-border: #9f1239;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }
        body {
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
        }
        /* Gece/Gündüz Modu Butonu */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 12px var(--card-shadow);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card {
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px var(--card-shadow);
            text-align: center;
            max-width: 450px;
            width: 90%;
            backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        h2 { color: #e63946; margin-bottom: 15px; font-weight: 700; }
        p { color: var(--text-sub); font-size: 14px; margin-bottom: 15px; line-height: 1.5; }
        input {
            width: 100%; padding: 14px; border: 2px solid var(--input-border);
            background: transparent; color: var(--text-main); border-radius: 15px;
            outline: none; font-size: 16px; margin-bottom: 15px; text-align: center;
        }
        .btn-main {
            width: 100%; background-color: #e63946; color: white; border: none;
            padding: 14px; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: #e63946; font-size: 14px; margin-top: 15px; display: none; font-weight: 600; }
        .toast-msg { color: #e63946; font-weight: bold; font-size: 13px; margin-top: 10px; min-height: 20px; }
        #main-content { display: none; }
        .ask-container { margin-top: 20px; position: relative; height: 100px; }
        .btn-vote {
            padding: 12px 28px; border-radius: 50px; font-weight: bold;
            cursor: pointer; border: none; position: absolute; font-size: 15px;
            transition: all 0.2s ease-out;
        }
        #btn-yes { background-color: #2ecc71; color: white; left: 20%; transform: translateX(-50%); z-index: 10; }
        #btn-no { background-color: #95a5a6; color: white; right: 20%; transform: translateX(50%); white-space: nowrap; }
        /* Uçan Sihirli Kalp */
        .magic-heart {
            position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            font-size: 38px; cursor: pointer; z-index: 999; display: none;
            animation: pulse 1.5s infinite alternate; filter: drop-shadow(0 0 10px rgba(230,57,70,0.5));
        }
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.2); }
        }
        /* Bildirim Kartları Container */
        .notification-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 380px; z-index: 2000; display: flex; flex-direction: column; gap: 10px;
        }
        .notif {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 18px; padding: 12px 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 12px;
            transform: translateY(-100px); opacity: 0;
            animation: slideDown 0.5s forwards ease-out;
            border-left: 4px solid #e63946;
        }
        .notif.ig { border-left-color: #d62976; }
        .notif.wa { border-left-color: #25d366; }
        .notif-icon { font-size: 22px; }
        .notif-text { text-align: left; }
        .notif-title { font-size: 13px; font-weight: bold; color: #111; }
        .notif-desc { font-size: 12px; color: #444; margin-bottom: 0; }
        @keyframes slideDown {
            to { transform: translateY(0); opacity: 1; }
        }
        /* "Tıkla Bence" Butonu ve Kazı Kazan Alanı */
        .scratch-trigger-btn {
            background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%);
            color: white; border: none; padding: 12px 20px;
            border-radius: 25px; font-weight: 700; font-size: 14px;
            cursor: pointer; margin-top: 15px; width: 100%;
            box-shadow: 0 4px 15px rgba(255,77,109,0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .scratch-trigger-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,77,109,0.4);
        }
        .scratch-container {
            position: relative; width: 100%; height: 110px; margin-top: 15px;
            border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none; /* İlk başta gizli */
        }
        .scratch-secret {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 10px; color: #d62839; font-weight: 700; font-size: 14px; text-align: center;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        .floating-emoji {
            position: absolute; font-size: 24px; user-select: none;
            animation: floatUp 3s linear infinite; z-index: 100; pointer-events: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Gece Modu</button>
    <!-- Bildirim Yuvası -->
    <div class="notification-container" id="notifArea"></div>
    <!-- Tıklanacak Sihirli Kalp -->
    <div class="magic-heart" id="magicHeart" onclick="triggerNotifications()">💌</div>
    <!-- GİRİŞ EKRANI -->
    <div id="login-screen" class="card">
        <h2>Hoş Geldin AZİZEM❤️</h2>
        <p>Devam etmek için özel şifremizi girmen gerekiyor:</p>
        <input type="text" id="password-input" placeholder="Şifreniz..." onkeypress="handleKeyPress(event)">
        <button class="btn-main" onclick="checkPassword()">Giriş Yap</button>
        <div id="error-message" class="error-msg">Yanlış şifre! Bir daha dene bakalım </div>
    </div>
    <!-- ANA İÇERİK -->
    <div id="main-content" class="card">
        <h2>Seni Çok Seviyorum! ✨</h2>
        <p>Biliyorum belki seni kırdım... Ama senin gönlünü almak benim için her şeyden önemli.</p>
        <h3 style="color: #e63946; margin-top: 10px; font-size: 16px;">Beni affettin mi? 🥺</h3>
        <div id="toast" class="toast-msg"></div>
        <div class="ask-container">
            <button id="btn-yes" class="btn-vote" onclick="accepted()">Evet</button>
            <button id="btn-no" class="btn-vote" onmouseover="moveButton()" onclick="moveButton()">Hayır</button>
        </div>
    </div>
    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", newTheme);
            document.getElementById("themeBtn").innerText = newTheme === "dark" ? "☀️ Gündüz Modu" : "🌙 Gece Modu";
        }
        function checkPassword() {
            const input = document.getElementById("password-input").value.trim().toLowerCase();
            const errorMsg = document.getElementById("error-message");
            if (input === "azizemm") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                document.getElementById("magicHeart").style.display = "block";
            } else {
                errorMsg.style.display = "block";
                document.getElementById("password-input").value = "";
            }
        }
        function handleKeyPress(event) {
            if (event.key === "Enter") checkPassword();
        }
        // --- BİLDİRİM TETİKLEME ---
        let notifTriggered = false;
        function triggerNotifications() {
            if (notifTriggered) return;
            notifTriggered = true;
            const magicHeart = document.getElementById("magicHeart");
            magicHeart.style.display = "none";
            const notifArea = document.getElementById("notifArea");
            // 1. Bildirim (Instagram)
            setTimeout(() => {
                const n1 = document.createElement("div");
                n1.className = "notif ig";
                n1.innerHTML = `
                    <div class="notif-icon">📸</div>
                    <div class="notif-text">
                        <div class="notif-title">Instagram • Mesaj</div>
                        <div class="notif-desc">Seni Çok Özledim... 💬</div>
                    </div>
                `;
                notifArea.appendChild(n1);
            }, 300);
            // 2. Bildirim (Kalbinizden)
            setTimeout(() => {
                const n2 = document.createElement("div");
                n2.className = "notif wa";
                n2.innerHTML = `
                    <div class="notif-icon">💗</div>
                    <div class="notif-text">
                        <div class="notif-title">Kalbinizden 1 Yeni Bildirim</div>
                        <div class="notif-desc">Onu affetmelisin! 🥺</div>
                    </div>
                `;
                notifArea.appendChild(n2);
            }, 1200);
            // Bildirimleri 5sn sonra ekrandan temizle
            setTimeout(() => {
                notifArea.innerHTML = "";
            }, 6000);
        }
        // --- HAYIR BUTONU KODLARI ---
        let noCount = 0;
        let yesScale = 1;
        const noTexts = ["Hayır", "Emin misin?", "Bir daha düşün?", "Yapma lütfen 🥺", "Ciddi olamazsın!", "Bana kıyamazsın ki...", "Azer Bülbül üzülüyor!", "Bence Evet de 😉"];
        const warnings = ["Sistem Hatası: 'Hayır' cevabı kalbiniz tarafından reddedildi! 🚫", "Yanlış buton! Yeşil olana basman gerekiyordu 😜", "Cihazınız bu kararı kabul etmiyor! 🔥", "Lütfen kalbinizin sesini dinleyin 🥺"];
        function moveButton() {
            const btnNo = document.getElementById('btn-no');
            const btnYes = document.getElementById('btn-yes');
            const container = document.querySelector('.ask-container');
            const card = document.getElementById('main-content');
            const toast = document.getElementById('toast');
            noCount++;
            btnNo.innerText = noTexts[noCount % noTexts.length];
            yesScale += 0.15;
            btnYes.style.transform = `translateX(-50%) scale(${yesScale})`;
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 300);
            toast.innerText = warnings[noCount % warnings.length];
            createSadEmojis();
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNo.getBoundingClientRect();
            const maxX = containerRect.width - btnRect.width;
            const maxY = containerRect.height - btnRect.height;
            let newX, newY;
            do {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
            } while (Math.abs(newX - btnNo.offsetLeft) < 40 && Math.abs(newY - btnNo.offsetTop) < 40);
            btnNo.style.left = newX + 'px';
            btnNo.style.top = newY + 'px';
            btnNo.style.right = 'auto';
            btnNo.style.transform = 'none';
        }
        function createSadEmojis() {
            const sadEmojis = ['🥺', '😭', '💔'];
            for(let i=0; i<3; i++) {
                const emoji = document.createElement('div');
                emoji.classList.add('floating-emoji');
                emoji.innerText = sadEmojis[Math.floor(Math.random() * sadEmojis.length)];
                emoji.style.left = Math.random() * 90 + 'vw';
                emoji.style.top = '80vh';
                document.body.appendChild(emoji);
                setTimeout(() => { emoji.remove(); }, 2500);
            }
        }
        // --- AFFETME EYLEMİ VE "TIKLA BENCE" BUTONU ---
        function accepted() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <h2>OLEY! ❤️</h2>
                <p style="font-weight: 600; margin-bottom: 10px;">Dünyanın en mutlu insanı benim! Seni çok seviyorum, iyi ki varsın.</p>
                <div class="praise-box" style="background: var(--box-bg); padding: 12px; border-radius: 15px; border: 1px dashed var(--box-border);">
                    <p style="margin-bottom: 6px; font-style: italic; color: #e63946; font-size: 12px; font-weight: 600;">"Barıştığımıza göre... Şimdi kaybettiğim meleği geri öpebilirim ✨"</p>
                    <p style="margin-bottom: 6px; font-style: italic; color: #e63946; font-size: 12px; font-weight: 600;">"Gülüşünle dünyamı tekrardan aydınlattığın için teşekkür ederim."</p>
                    <p style="margin-bottom: 6px; font-style: italic; color: #e63946; font-size: 12px; font-weight: 600;">"Gözlerinin içinde kaybolmayı o kadar çok özlemiştim ki... ✨"</p>
                    <p style="margin-bottom: 0; font-style: italic; color: #e63946; font-size: 12px; font-weight: 600;">"Sen benim en güzel 'iyi ki'msin... Seni bir daha asla üzmeyeceğime söz veriyorum ❤️"</p>
                </div>
                <!-- Tıkla Bence Butonu -->
                <button class="scratch-trigger-btn" id="openScratchBtn" onclick="showScratchCard()">Tıkla Bence 🪙</button>
                <!-- Gizli Kazı Kazan Kartı -->
                <div class="scratch-container" id="scratchCardArea">
                    <div class="scratch-secret">
                        ✨ "Gülüşünü özlediğim tek insan..." ✨
                        <span style="font-size: 20px; margin-top: 5px;">💖💖💖</span>
                    </div>
                    <canvas id="scratchCanvas"></canvas>
                </div>
            `;
            const audio = new Audio('Azer Bülbül - Ben Seninle Mutluyum(_t1jBwvACMgk_).m4a');
            audio.play();
            for(let i=0; i<30; i++) {
                createHeart();
            }
        }
        // Butona Basılınca Kazı Kazan Kartını Açan Fonksiyon
        function showScratchCard() {
            document.getElementById('openScratchBtn').style.display = 'none';
            const cardArea = document.getElementById('scratchCardArea');
            cardArea.style.display = 'block';
            initScratchCard();
        }
        // Kazı Kazan Mantığı
        function initScratchCard() {
            const canvas = document.getElementById('scratchCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.fillStyle = '#b0bec5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 14px Poppins';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText('🪙 Kazımak İçin Dokun!', canvas.width / 2, canvas.height / 2 + 5);
            let isDrawing = false;
            function scratch(e) {
                if (!isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 18, 0, Math.PI * 2);
                ctx.fill();
            }
            canvas.addEventListener('mousedown', () => isDrawing = true);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mousemove', scratch);
            canvas.addEventListener('touchstart', () => isDrawing = true);
            canvas.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('touchmove', scratch);
        }
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-emoji');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 3000);
        }
    </script>
</body>
</html>
